replicaCount: 1

image:
  repository: ghcr.io/dayflower/webcappi
  tag: "0.1.1"
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Chromium's sandbox is enabled by default. Set true only as an explicit opt-out.
browser:
  noSandbox: false
  # Existing node profiles, applied only to the API container.
  seccompProfile:
    type: RuntimeDefault
    localhostProfile: ""
  # Empty type preserves the runtime's AppArmor default on hosts without AppArmor.
  appArmorProfile:
    type: ""
    localhostProfile: ""

# Create the Secret separately. Credentials are read only at application startup.
auth:
  enabled: true
  existingSecret: ""
  tokenKey: token

cache:
  backend: memory
  redis:
    address: ""
    namespace: ""
    generation: ""
    username: ""
    passwordSecret:
      name: ""
      key: ""
    tls: false
    ca:
      kind: ConfigMap
      name: ""
      key: ""
    timeoutMS: 500
    retentionSeconds: 86400

# Explicit zero capacities and maxAgeSeconds=0 retain their application meaning.
capture:
  concurrency: 1
  queueSize: 8
  maxRequests: 64
  timeoutSeconds: 30
  metadataMaxBytes: 1048576
  metadataMaxEntries: 128
  maxAgeSeconds: 60
  maxWidth: 4096
  maxHeight: 4096
  maxPixels: 8388608
  resizeAlgorithm: bilinear
  maxProfileBytes: 536870912
  maxPOSTBytes: 1048576
  maxPNGBytes: 41943040

profiles:
  # Application profile descriptors, including their snake_case field names.
  descriptors: {}
  bundle:
    # A tag must be immutable; a digest is preferred and takes precedence.
    repository: ""
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
    sizeLimit: 1Gi

service:
  port: 8080
  annotations: {}

# Controllers, Gateway API CRDs, Gateways and TLS Secrets are operator-managed.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  # - host: capture.example.com
  #   paths:
  #     - path: /
  #       pathType: Prefix
  tls: []

httpRoute:
  enabled: false
  annotations: {}
  parentRefs: []
  # - name: public
  #   namespace: gateway-system
  #   sectionName: https
  hostnames: []
  paths:
    - type: PathPrefix
      value: /
  # Explicit durations: one integer followed by ms, s, m or h; 0s disables.
  timeouts: {}
  # request: 45s
  # backendRequest: 40s

resources:
  requests:
    cpu: 500m
    memory: 512Mi
    ephemeral-storage: 1Gi
  limits:
    cpu: "2"
    memory: 2Gi
    ephemeral-storage: 4Gi
volumes:
  workSizeLimit: 2Gi
  tmpSizeLimit: 256Mi
  shmSizeLimit: 512Mi
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
