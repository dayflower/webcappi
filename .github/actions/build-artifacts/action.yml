name: Build verified artifacts
description: Export both CLI binaries and an OCI archive, then compare their executables.
runs:
  using: composite
  steps:
    - name: Set up build-time arm64 emulation
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      with:
        image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
        platforms: arm64
    - name: Set up multi-platform builder
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        version: v0.38.1
        driver-opts: image=${{ env.BUILDKIT_IMAGE }}
    - name: Restore native image build caches
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        build-args: |
          WEBCAPPI_VERSION=${{ env.WEBCAPPI_VERSION }}
          WEBCAPPI_REVISION=${{ env.WEBCAPPI_REVISION }}
          WEBCAPPI_MODIFIED=${{ env.WEBCAPPI_MODIFIED }}
        outputs: type=cacheonly
        cache-from: |
          type=gha,scope=runtime-amd64
          type=gha,scope=runtime-arm64
    - shell: bash
      run: make binaries
    - shell: bash
      run: make image-multi
    - name: Verify ELF binaries and OCI runtime platforms
      shell: bash
      run: python3 scripts/verify-build.py
