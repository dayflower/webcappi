name: GitHub Release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      revision:
        type: string
        default: ''
      digest:
        type: string
        default: ''
      chart_record_artifact:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published version tag (for example v0.1.1)
        required: true
        type: string

permissions:
  contents: read

jobs:
  identity:
    name: Resolve release and chart recovery requirements
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      supported: ${{ steps.identity.outputs.supported }}
      revision: ${{ steps.identity.outputs.revision }}
      image_digest: ${{ steps.identity.outputs.image_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-chart
      - name: Install image inspector
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y skopeo
      - name: Inspect the target tag, including historical binary-only releases
        id: identity
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_REVISION: ${{ inputs.revision }}
          EXPECTED_DIGEST: ${{ inputs.digest }}
        run: python3 scripts/release-charts.py discover --tag "$RELEASE_TAG" --revision "$EXPECTED_REVISION" --image-digest "$EXPECTED_DIGEST" --github-output "$GITHUB_OUTPUT"

  chart_recovery:
    name: Read-only chart recovery acceptance
    needs: identity
    if: needs.identity.outputs.supported == 'true' && inputs.chart_record_artifact == ''
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/chart-verify.yml
    with:
      stage: recovery
      tag: ${{ inputs.tag }}
      revision: ${{ needs.identity.outputs.revision }}
      image_digest: ${{ needs.identity.outputs.image_digest }}

  release:
    name: Create release and attach verified binaries
    needs: [identity, chart_recovery]
    if: ${{ !cancelled() && !failure() && needs.identity.result == 'success' && (needs.identity.outputs.supported != 'true' || inputs.chart_record_artifact != '' || needs.chart_recovery.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: read
    concurrency:
      group: github-webcappi-release
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      EXPECTED_REVISION: ${{ inputs.revision }}
      EXPECTED_DIGEST: ${{ inputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install OCI transfer tool
        run: |
          echo "REGISTRY_AUTH_FILE=$RUNNER_TEMP/webcappi-github-release-auth.json" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y skopeo
      - uses: ./.github/actions/setup-chart
      - name: Download native chart acceptance record
        if: needs.identity.outputs.supported == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.chart_record_artifact || needs.chart_recovery.outputs.record_artifact }}
          path: artifacts/chart-acceptance
      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          subprocess.run(
              ["skopeo", "login", "--username", os.environ["GHCR_USER"], "--password-stdin", "ghcr.io"],
              input=os.environ["GHCR_TOKEN"], text=True, check=True,
          )
          PY
      - name: Recover binaries and publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          options=()
          if [[ -f artifacts/chart-acceptance/chart-distribution.json ]]; then
            options+=(--chart-record artifacts/chart-acceptance/chart-distribution.json)
          fi
          python3 scripts/github_release.py --tag "$RELEASE_TAG" --revision "$EXPECTED_REVISION" --digest "$EXPECTED_DIGEST" "${options[@]}"
      - name: Remove registry credentials
        if: ${{ always() }}
        run: rm -f "$REGISTRY_AUTH_FILE"
