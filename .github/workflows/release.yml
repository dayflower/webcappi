name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag with an already published image to recover
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate release identity
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      revision: ${{ steps.release.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and main ancestry
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_REVISION: ${{ github.sha }}
          RECOVERY_ONLY: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [[ "$RECOVERY_ONLY" == true ]]; then
            RELEASE_REVISION="$(git rev-parse HEAD)"
          fi
          python3 scripts/release.py validate --tag "$RELEASE_TAG" --revision "$RELEASE_REVISION" --github-output "$GITHUB_OUTPUT"
      - name: Validate chart release metadata
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 -m venv "$RUNNER_TEMP/chart-metadata"
          "$RUNNER_TEMP/chart-metadata/bin/pip" install PyYAML==6.0.2
          "$RUNNER_TEMP/chart-metadata/bin/python" scripts/release-charts.py validate --tag "$RELEASE_TAG"

  resolve:
    name: Resolve verified CI candidate
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ steps.candidate.outputs.mode }}
      run_id: ${{ steps.candidate.outputs.run_id }}
      run_attempt: ${{ steps.candidate.outputs.run_attempt }}
      bundle_id: ${{ steps.candidate.outputs.bundle_id }}
      qualification_id: ${{ steps.candidate.outputs.qualification_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install image inspector
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y skopeo
      - name: Reuse an existing release or wait for the exact main push CI
        id: candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_REVISION: ${{ needs.validate.outputs.revision }}
          RECOVERY_ONLY: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          options=()
          if [[ "$RECOVERY_ONLY" == true ]]; then
            options+=(--published-only)
          fi
          python3 scripts/ci_reuse.py resolve --version "$RELEASE_VERSION" --revision "$RELEASE_REVISION" --github-output "$GITHUB_OUTPUT" "${options[@]}"

  candidate:
    name: Rebuild and fully qualify unavailable candidate
    needs: [validate, resolve]
    if: needs.resolve.outputs.mode == 'fallback'
    uses: ./.github/workflows/candidate.yml
    with:
      version: ${{ needs.validate.outputs.version }}

  publish:
    name: Publish verified image to GHCR
    needs: [validate, resolve, candidate]
    if: ${{ !cancelled() && !failure() && needs.resolve.result == 'success' && (needs.candidate.result == 'success' || needs.candidate.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    permissions:
      contents: read
      actions: read
      packages: write
    concurrency:
      group: ghcr-webcappi-publish
      cancel-in-progress: false
    env:
      BUILDKIT_IMAGE: moby/buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      DOCKER_BUILD_RECORD_UPLOAD: "false"
      WEBCAPPI_VERSION: ${{ needs.validate.outputs.version }}
      WEBCAPPI_REVISION: ${{ needs.validate.outputs.revision }}
      WEBCAPPI_MODIFIED: "false"
      CANDIDATE_MODE: ${{ needs.resolve.outputs.mode }}
      CANDIDATE_RUN: ${{ needs.resolve.outputs.run_id || github.run_id }}
      CANDIDATE_ATTEMPT: ${{ needs.resolve.outputs.run_attempt || needs.candidate.outputs.run_attempt }}
      CANDIDATE_BUNDLE: ${{ needs.resolve.outputs.bundle_id || needs.candidate.outputs.bundle_id }}
      CANDIDATE_QUALIFICATION: ${{ needs.resolve.outputs.qualification_id || needs.candidate.outputs.qualification_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install OCI transfer tool
        run: |
          echo "REGISTRY_AUTH_FILE=$RUNNER_TEMP/webcappi-registry-auth.json" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y skopeo
      - name: Recheck the exact successful main CI attempt
        if: env.CANDIDATE_MODE == 'reuse'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci_reuse.py verify-run --version "$WEBCAPPI_VERSION" --revision "$WEBCAPPI_REVISION" --run-id "$CANDIDATE_RUN" --run-attempt "$CANDIDATE_ATTEMPT"
      - name: Download the selected qualified candidate
        if: env.CANDIDATE_MODE != 'published'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ env.CANDIDATE_BUNDLE }}
          run-id: ${{ env.CANDIDATE_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts
          merge-multiple: true
      - name: Download the selected native qualification
        if: env.CANDIDATE_MODE != 'published'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ env.CANDIDATE_QUALIFICATION }}
          run-id: ${{ env.CANDIDATE_RUN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/qualification
          merge-multiple: true
      - name: Verify candidate checksums, OCI identity and both native receipts
        if: env.CANDIDATE_MODE != 'published'
        run: python3 scripts/ci_artifacts.py verify --qualification artifacts/qualification/qualification.json --run-id "$CANDIDATE_RUN" --run-attempt "$CANDIDATE_ATTEMPT" --bundle-id "$CANDIDATE_BUNDLE"
      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          subprocess.run(
              ["skopeo", "login", "--username", os.environ["GHCR_USER"], "--password-stdin", "ghcr.io"],
              input=os.environ["GHCR_TOKEN"], text=True, check=True,
          )
          PY
      - name: Publish archive and update latest
        id: publish
        run: |
          options=()
          if [[ "$CANDIDATE_MODE" == published ]]; then
            options+=(--reuse)
          fi
          python3 scripts/release.py publish --tag "$WEBCAPPI_VERSION" --revision "$WEBCAPPI_REVISION" --github-output "$GITHUB_OUTPUT" "${options[@]}"
      - name: Upload release binaries and verification report
        if: env.CANDIDATE_MODE != 'published'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-binaries-${{ github.ref_name }}-${{ github.run_attempt }}
          path: |
            artifacts/binaries/
            artifacts/build-verification.json
          if-no-files-found: error
          retention-days: 7
      - name: Remove registry credentials
        if: ${{ always() }}
        run: rm -f "$REGISTRY_AUTH_FILE"

  chart_archive:
    name: Qualify chart distribution archive
    needs: [validate, publish]
    if: ${{ !cancelled() && !failure() && needs.validate.result == 'success' && needs.publish.result == 'success' }}
    uses: ./.github/workflows/chart-verify.yml
    permissions:
      contents: read
      packages: read
    with:
      stage: archive
      tag: ${{ needs.validate.outputs.version }}
      revision: ${{ needs.validate.outputs.revision }}
      image_digest: ${{ needs.publish.outputs.digest }}

  publish_chart:
    name: Publish verified chart to GHCR
    needs: [validate, publish, chart_archive]
    if: ${{ !cancelled() && !failure() && needs.validate.result == 'success' && needs.publish.result == 'success' && needs.chart_archive.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ghcr-webcappi-chart-publish
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.version }}
      RELEASE_REVISION: ${{ needs.validate.outputs.revision }}
      IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-chart
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.chart_archive.outputs.candidate_artifact }}
          path: artifacts/candidate
      - name: Publish or reuse identical chart contents
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEBCAPPI_CHART_AUTH_DIR: ${{ runner.temp }}/webcappi-chart-auth
        run: |
          version="${RELEASE_TAG#v}"
          python3 scripts/release-charts.py publish --archive "artifacts/candidate/webcappi-$version.tgz" --tag "$RELEASE_TAG" --revision "$RELEASE_REVISION" --image-digest "$IMAGE_DIGEST"
      - name: Remove chart registry credentials
        if: ${{ always() }}
        env:
          WEBCAPPI_CHART_AUTH_DIR: ${{ runner.temp }}/webcappi-chart-auth
        run: rm -rf "$WEBCAPPI_CHART_AUTH_DIR"

  chart_public:
    name: Qualify anonymous chart distribution
    needs: [validate, publish, chart_archive, publish_chart]
    if: ${{ !cancelled() && !failure() && needs.validate.result == 'success' && needs.publish.result == 'success' && needs.chart_archive.result == 'success' && needs.publish_chart.result == 'success' }}
    uses: ./.github/workflows/chart-verify.yml
    permissions:
      contents: read
      packages: read
    with:
      stage: public
      tag: ${{ needs.validate.outputs.version }}
      revision: ${{ needs.validate.outputs.revision }}
      image_digest: ${{ needs.publish.outputs.digest }}
      candidate_artifact: ${{ needs.chart_archive.outputs.candidate_artifact }}

  github_release:
    name: Publish GitHub Release
    needs: [validate, publish, chart_public]
    if: ${{ !cancelled() && !failure() && needs.validate.result == 'success' && needs.publish.result == 'success' && needs.chart_public.result == 'success' }}
    permissions:
      contents: write
      packages: read
    uses: ./.github/workflows/github-release.yml
    with:
      tag: ${{ needs.validate.outputs.version }}
      revision: ${{ needs.validate.outputs.revision }}
      digest: ${{ needs.publish.outputs.digest }}
      chart_record_artifact: ${{ needs.chart_public.outputs.record_artifact }}
