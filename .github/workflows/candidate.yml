name: Release candidate

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
    outputs:
      bundle_id:
        value: ${{ jobs.build.outputs.bundle_id }}
      qualification_id:
        value: ${{ jobs.qualify.outputs.artifact_id }}
      run_attempt:
        value: ${{ jobs.qualify.outputs.run_attempt }}

permissions:
  contents: read

env:
  BUILDKIT_IMAGE: moby/buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  WEBCAPPI_VERSION: ${{ inputs.version }}
  WEBCAPPI_REVISION: ${{ github.sha }}
  WEBCAPPI_MODIFIED: "false"

jobs:
  build:
    name: Multi-platform candidate build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      bundle_id: ${{ steps.bundle.outputs.artifact-id }}
      bundle_name: release-candidate-${{ github.run_attempt }}
      metadata_name: candidate-metadata-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-artifacts
      - name: Record candidate identity and checksums
        run: python3 scripts/ci_artifacts.py record
      - name: Upload candidate without recompressing OCI layers
        id: bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate-${{ github.run_attempt }}
          path: |
            artifacts/candidate.json
            artifacts/webcappi.oci.tar
            artifacts/build-verification.json
            artifacts/binaries/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-metadata-${{ github.run_attempt }}
          path: artifacts/candidate.json
          if-no-files-found: error
          retention-days: 7

  verify:
    needs: build
    uses: ./.github/workflows/verify.yml
    with:
      version: ${{ inputs.version }}
      candidate_artifact: ${{ needs.build.outputs.bundle_name }}

  qualify:
    name: Seal native candidate qualification
    needs: [build, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      run_attempt: ${{ steps.attempt.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.metadata_name }}
          path: artifacts/metadata
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: candidate-runtime-*
          path: artifacts/runtime
      - name: Require exact candidate images on both native platforms
        env:
          BUNDLE_ID: ${{ needs.build.outputs.bundle_id }}
        run: python3 scripts/ci_artifacts.py qualify --metadata artifacts/metadata/candidate.json --receipts artifacts/runtime --bundle-id "$BUNDLE_ID" --output artifacts/qualification.json
      - id: attempt
        run: echo "value=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-qualification-${{ github.run_attempt }}
          path: artifacts/qualification.json
          if-no-files-found: error
          retention-days: 7
