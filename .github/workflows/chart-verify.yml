name: Chart distribution acceptance

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      revision:
        required: true
        type: string
      image_digest:
        required: true
        type: string
      stage:
        description: archive, public, or recovery (both, without publication)
        required: true
        type: string
      candidate_artifact:
        type: string
        default: ''
    outputs:
      candidate_artifact:
        value: ${{ jobs.package.outputs.artifact || inputs.candidate_artifact }}
      record_artifact:
        value: ${{ jobs.record.outputs.artifact }}

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash

env:
  RELEASE_TAG: ${{ inputs.tag }}
  RELEASE_REVISION: ${{ inputs.revision }}
  IMAGE_DIGEST: ${{ inputs.image_digest }}
  GOTOOLCHAIN: local

jobs:
  package:
    if: inputs.stage == 'archive' || inputs.stage == 'recovery'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact: ${{ steps.name.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - uses: ./.github/actions/setup-chart
      - name: Install image identity inspector
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y skopeo
      - name: Prepare chart from the release revision without modifying the checkout
        run: python3 scripts/release-charts.py package --tag "$RELEASE_TAG" --revision "$RELEASE_REVISION" --image-digest "$IMAGE_DIGEST" --source-revision
      - id: name
        run: echo "artifact=chart-candidate-$RELEASE_TAG-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: artifacts/chart-release/*.tgz
          if-no-files-found: error
          retention-days: 30

  archive:
    needs: package
    if: inputs.stage == 'archive' || inputs.stage == 'recovery'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - uses: ./.github/actions/setup-chart
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.package.outputs.artifact }}
          path: artifacts/candidate
      - name: Qualify the distribution archive and its default image
        run: |
          version="${RELEASE_TAG#v}"
          python3 scripts/release-charts.py accept --archive "artifacts/candidate/webcappi-$version.tgz" --tag "$RELEASE_TAG" --revision "$RELEASE_REVISION" --image-digest "$IMAGE_DIGEST" --output artifacts/chart-archive
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: chart-proof-${{ inputs.tag }}-${{ github.run_attempt }}-archive-${{ matrix.arch }}
          path: artifacts/chart-archive/
          if-no-files-found: warn
          retention-days: 30

  public:
    needs: [package, archive]
    if: ${{ !cancelled() && !failure() && (inputs.stage == 'public' || inputs.stage == 'recovery') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - uses: ./.github/actions/setup-chart
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.package.outputs.artifact || inputs.candidate_artifact }}
          path: artifacts/candidate
      - name: Verify anonymous chart identity and run enabled distribution smoke
        run: |
          version="${RELEASE_TAG#v}"
          python3 scripts/release-charts.py accept --public --archive "artifacts/candidate/webcappi-$version.tgz" --tag "$RELEASE_TAG" --revision "$RELEASE_REVISION" --image-digest "$IMAGE_DIGEST" --output artifacts/chart-public
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: chart-proof-${{ inputs.tag }}-${{ github.run_attempt }}-public-${{ matrix.arch }}
          path: artifacts/chart-public/
          if-no-files-found: warn
          retention-days: 30

  record:
    needs: [package, archive, public]
    if: ${{ !cancelled() && !failure() && needs.public.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      artifact: ${{ steps.name.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-chart
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.package.outputs.artifact || inputs.candidate_artifact }}
          path: artifacts/candidate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: chart-proof-${{ inputs.tag }}-*
          path: artifacts/evidence
      - name: Require full archive acceptance and anonymous distribution smoke on both architectures
        run: |
          version="${RELEASE_TAG#v}"
          python3 scripts/release-charts.py finalize --archive "artifacts/candidate/webcappi-$version.tgz" --tag "$RELEASE_TAG" --revision "$RELEASE_REVISION" --image-digest "$IMAGE_DIGEST" --evidence artifacts/evidence
      - id: name
        run: echo "artifact=chart-distribution-$RELEASE_TAG-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: artifacts/chart-release/chart-distribution.json
          if-no-files-found: error
          retention-days: 30
