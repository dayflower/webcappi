name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILDKIT_IMAGE: moby/buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  WEBCAPPI_VERSION: dev
  WEBCAPPI_REVISION: ${{ github.sha }}
  WEBCAPPI_MODIFIED: "false"

jobs:
  identity:
    name: Resolve candidate version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read matching chart version and appVersion
        id: version
        run: |
          python3 -m venv "$RUNNER_TEMP/candidate-python"
          "$RUNNER_TEMP/candidate-python/bin/pip" install PyYAML==6.0.2
          "$RUNNER_TEMP/candidate-python/bin/python" scripts/ci_artifacts.py version --github-output "$GITHUB_OUTPUT"

  candidate:
    if: github.ref == 'refs/heads/main'
    needs: identity
    uses: ./.github/workflows/candidate.yml
    with:
      version: ${{ needs.identity.outputs.version }}

  verify:
    if: github.ref != 'refs/heads/main'
    uses: ./.github/workflows/verify.yml

  build:
    name: Multi-platform build
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-artifacts
      - name: Upload CLI binaries and verification report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ github.run_attempt }}
          path: |
            artifacts/binaries/
            artifacts/build-verification.json
          if-no-files-found: error
          retention-days: 7
